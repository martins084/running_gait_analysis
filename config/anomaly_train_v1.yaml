experiment:
  name: anomaly_train_v1
  seed: 42
  run_id_prefix: ric-anom

data:
  # Session split CSV created by scripts/build_subject_splits.py
  session_split_csv: data/processed/splits/session_split_v1.csv
  # Local directory containing reformat_data/<subject>/<session>.json
  json_root: data/ric/reformat_data
  seq_len: 180
  prefer_mode: run
  normalize: zscore
  train_random_window: true
  train_include_injured: false
  val_include_injured: true
  # none: raw marker XYZ (padded). motion_stats: append per-frame |v|,|a|,|j| of the full pose.
  feature_engineering: none

train:
  batch_size: 16
  num_workers: 0
  epochs: 20
  learning_rate: 0.001
  weight_decay: 0.0001
  hidden_size: 128
  grad_clip_norm: 1.0
  device: auto   # auto|cpu|cuda
  # only used when data.train_include_injured is true: balance reconstruction loss like sklearn class_weight.
  # none | balanced | inverse
  recon_class_weight: none
  # if true, same as data.train_include_injured: resample sessions so hurt vs healthy batches less skewed
  oversample_train_injured: false

output:
  checkpoints_dir: checkpoints
  logs_dir: logs
  results_dir: results

