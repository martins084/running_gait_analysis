experiment:
  name: classifier_v1
  seed: 42
  run_id_prefix: ric-clf-v1

data:
  session_split_csv: data/processed/splits/session_split_v1.csv
  json_root: data/ric/reformat_data
  seq_len: 180            # 1.5 s at 120 Hz | 0.9 s at 200 Hz
  prefer_mode: run
  normalize: zscore
  train_random_window: true
  label_col: is_injured_strict   # explicit injury metadata required (stricter label)

  feature_engineering: motion_stats   # appends |v|, |a|, |jerk| per frame

  # Butterworth 4th-order zero-phase low-pass filter.
  lp_filter_hz: 15.0
  lp_filter_source_hz: 120.0   # assumed recording rate; change to 200 for 200 Hz sessions

  # Augmentation (applied to training split only)
  aug_mirror: true          # 50 % chance: negate Z-axis of each marker (left-right flip)
  aug_mirror_prob: 0.5
  aug_time_warp: true       # random x0.9-1.1 time stretch — simulates speed variation
  aug_noise_sigma: 0.015    # Gaussian noise std (in normalised feature space)

model:
  hidden_size: 128
  num_layers: 2
  dropout: 0.3

train:
  batch_size: 64
  num_workers: 8            # set to 0 on Windows if multiprocessing issues arise
  epochs: 100
  learning_rate: 0.0005
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  device: auto              # auto | cpu | cuda

  # Class imbalance handling — WeightedRandomSampler or pos_weight fallback.
  oversample: true          # true = WeightedRandomSampler; false = pos_weight on loss
  pos_weight: null          # only used when oversample=false; null = auto-compute from data

  scheduler:
    enabled: true
    type: cosine            # cosine | plateau
    warmup_epochs: 5        # linear LR ramp-up before cosine decay starts
    # plateau-only options (ignored for cosine):
    mode: min
    metric: val_loss
    factor: 0.5
    patience: 8
    min_lr: 0.000001

  early_stopping:
    enabled: true
    patience: 20            # epochs without AUROC improvement before stop

output:
  checkpoints_dir: checkpoints
  logs_dir: logs
  results_dir: results
